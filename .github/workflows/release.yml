name: Release

# Runs when a release tag like v1.2.3 or 1.2.3 is pushed
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"

# Two releases never run side by side, and a release is never canceled halfway
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  versions:
    name: Check release
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check needs the history of the default branch
          fetch-depth: 0

      # Tag is on the default branch, library and README version, changelog entry,
      # and the version must not exist on Maven Central yet
      - name: Check the tag
        run: bash .github/scripts/check-release-version.sh "$GITHUB_REF_NAME" "$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  verify:
    name: Verify
    needs: versions
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # build covers detekt, the API check, the iOS klibs, lint, tests and the
      # minified release build of the demo app, which catches missing keep rules
      - name: Build
        run: >
          ./gradlew
          build
          --continue
          --console=plain
          -Pkotlin.native.ignoreDisabledTargets=true

  publish:
    name: Publish to Maven Central
    needs: [versions, verify]
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    # Holds the secrets, add required reviewers to this environment to approve every release by hand
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # Uploads and validates the release, which is then published from the Central Portal.
      # Use publishAndReleaseToMavenCentral to release right away.
      - name: Publish
        run: >
          ./gradlew
          publishToMavenCentral
          --console=plain
          -Pkotlin.native.ignoreDisabledTargets=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
