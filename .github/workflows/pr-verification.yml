name: PR verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the PR cancels the run that is still in progress
concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Fails if the committed gradle-wrapper.jar is not an official Gradle release
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Static analysis and formatting (detekt includes the ktlint and Compose rules)
      - name: Detekt
        run: ./gradlew detekt --console=plain

      # Fails when the public API differs from the committed api dumps
      - name: Check public API
        run: ./gradlew checkKotlinAbi --console=plain

      # iOS targets cannot be compiled on Linux, so only the Android side is compiled
      - name: Compile
        run: ./gradlew compileAndroidMain compileDebugKotlin --console=plain

      - name: Android lint
        run: ./gradlew lint --console=plain

      # No tests exist yet, this starts to matter as soon as the first one is added
      - name: Tests
        run: ./gradlew allTests --console=plain
